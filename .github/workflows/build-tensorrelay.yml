name: TensorRelay Build

on:
  push:
    branches: [tensorrelay]
  workflow_dispatch:

concurrency:
  group: tensorrelay-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_COMMON: >-
    -DLLAMA_BUILD_EXAMPLES=OFF
    -DLLAMA_BUILD_TESTS=OFF
    -DLLAMA_BUILD_TOOLS=ON
    -DLLAMA_BUILD_SERVER=ON
    -DGGML_RPC=ON
    -DGGML_NATIVE=OFF
    -DGGML_BACKEND_DL=ON

jobs:
  linux-vulkan-x64:
    name: Linux Vulkan x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Show RPC protocol version from source
        run: |
          echo "=== RPC Protocol Version in Source ==="
          grep -E 'RPC_PROTO_(MAJOR|MINOR|PATCH)_VERSION' ggml/include/ggml-rpc.h
          echo "======================================"

      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev

      - name: Build
        run: |
          # Fresh tree avoids stale object files (e.g. ggml-rpc with old RPC_PROTO_*).
          rm -rf build
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_VULKAN=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            ${{ env.CMAKE_COMMON }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack artifacts
        run: |
          mkdir -p dist
          cp build/bin/llama-server dist/
          cp build/bin/rpc-server dist/
          # Copy all .so variants as real files (no symlinks — SteamPipe drops them)
          find build/bin -name '*.so*' -exec cp -L {} dist/ \;
          cp LICENSE dist/
          echo "Packed libraries:"
          ls -lh dist/*.so* || true
          # Verify versioned SONAMEs are present (not just unversioned .so)
          ls dist/*.so.0 >/dev/null 2>&1 || { echo "::error::No .so.0 files found — SONAME resolution will fail"; exit 1; }
          
          # Smoke test: verify libggml-rpc.so contains expected version string
          if [ -f dist/libggml-rpc.so ]; then
            echo "=== Checking libggml-rpc.so for version string ==="
            strings dist/libggml-rpc.so | grep "Starting RPC server" || echo "::warning::Version string not found in libggml-rpc.so"
          fi
          
          tar -czvf llama-tensorrelay-linux-vulkan-x64.tar.gz -C dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-tensorrelay-linux-vulkan-x64
          path: llama-tensorrelay-linux-vulkan-x64.tar.gz
          retention-days: 30

  windows-cuda-x64:
    name: Windows CUDA 13.1 x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Show RPC protocol version from source
        shell: pwsh
        run: |
          Write-Host "=== RPC Protocol Version in Source ==="
          Select-String -Path ggml/include/ggml-rpc.h -Pattern "RPC_PROTO_(MAJOR|MINOR|PATCH)_VERSION"
          Write-Host "======================================"

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.1'

      - name: Install Ninja
        run: choco install ninja

      - name: Cache Windows CUDA build
        id: cache-win-build
        uses: actions/cache@v4
        with:
          path: build
          key: win-cuda13.1-v2-${{ hashFiles('ggml/**', 'src/**', 'common/**', 'tools/**', 'CMakeLists.txt', 'ggml/CMakeLists.txt') }}

      - name: Build
        if: steps.cache-win-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if exist build rmdir /s /q build
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;100;120" ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            ${{ env.CMAKE_COMMON }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\bin\Release\llama-server.exe dist\
          Copy-Item build\bin\Release\rpc-server.exe dist\
          Get-ChildItem build\bin\Release\*.dll | Copy-Item -Destination dist\
          # Bundle CUDA runtime DLLs (not in build output, installed system-wide by toolkit)
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          Copy-Item "$cudaBin\cublas64_*.dll" dist\ -ErrorAction SilentlyContinue
          Copy-Item "$cudaBin\cublasLt64_*.dll" dist\ -ErrorAction SilentlyContinue
          Copy-Item "$cudaBin\cudart64_*.dll" dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist\
          Get-ChildItem dist\ | Format-Table Name, Length -AutoSize
          Compress-Archive -Path dist\* -DestinationPath llama-tensorrelay-win-cuda-13.1-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-tensorrelay-win-cuda-13.1-x64
          path: llama-tensorrelay-win-cuda-13.1-x64.zip
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux-vulkan-x64, windows-cuda-x64]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tensorrelay-${{ github.sha }}
          name: TensorRelay Build ${{ github.sha }}
          body: |
            Automated build from tensorrelay branch.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            artifacts/llama-tensorrelay-linux-vulkan-x64/llama-tensorrelay-linux-vulkan-x64.tar.gz
            artifacts/llama-tensorrelay-win-cuda-13.1-x64/llama-tensorrelay-win-cuda-13.1-x64.zip

      - name: Trigger TensorRelay Steam build
        env:
          DISPATCH_TOKEN: ${{ secrets.TENSORRELAY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "TENSORRELAY_DISPATCH_TOKEN not set; skip dispatch"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/mpainenz/tensorrelay/dispatches \
            -d '{"event_type":"llama-fork-release","client_payload":{"tag":"tensorrelay-${{ github.sha }}","commit":"${{ github.sha }}"}}'
          echo "Dispatched llama-fork-release to mpainenz/tensorrelay with tag tensorrelay-${{ github.sha }}"
