name: TensorRelay Build

# Validates and packages the TensorRelay Stage Executor Library (ADR-0015 /
# ADR-0016): the dynamically loaded C ABI the tensorrelay-runtime drives.
# The Steam packaging pipeline in the tensorrelay repo builds this fork from
# source itself (CPU-only); this workflow adds GPU-backend compile coverage
# (Vulkan on Linux, CUDA/MSVC on Windows) and publishes executor bundles for
# manual testing. The legacy llama-server / rpc-server artifacts are gone with
# the RPC path (hard removal, ADR-0015).

on:
  push:
    branches: [tensorrelay]
  workflow_dispatch:

concurrency:
  group: tensorrelay-${{ github.ref }}
  cancel-in-progress: true

env:
  # LLAMA_OPENSSL=OFF: the executor links llama-common (ABI v10 chat
  # templating) but never performs HTTP(S); with the default ON, common's
  # cpp-httplib picks up the runner's OpenSSL and the packaged
  # llama-common DLL/so imports libssl, which the client packaging step
  # rightly refuses to ship.
  CMAKE_COMMON: >-
    -DLLAMA_BUILD_EXAMPLES=OFF
    -DLLAMA_BUILD_TESTS=OFF
    -DLLAMA_BUILD_TOOLS=ON
    -DLLAMA_BUILD_SERVER=OFF
    -DLLAMA_OPENSSL=OFF
    -DGGML_RPC=OFF
    -DGGML_BACKEND_DL=ON
    -DGGML_NATIVE=OFF
    -DGGML_BACKEND_DL=ON

jobs:
  linux-vulkan-x64:
    name: Linux Vulkan x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk

      - name: Build stage executor
        run: |
          # Fresh tree avoids stale object files between workflow revisions.
          rm -rf build
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_VULKAN=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            ${{ env.CMAKE_COMMON }}
          cmake --build build --config Release --target tensorrelay_stage_executor -j $(nproc)

      - name: Pack artifacts
        run: |
          mkdir -p dist
          cp -L build/bin/libtensorrelay_stage_executor.so dist/
          # Copy the executor's runtime set: unversioned and SONAME names only,
          # materialized as real files (no symlinks — SteamPipe drops them).
          # Skip fully versioned files (libllama.so.0.0.NNNN); nothing
          # references them and they accumulate one per rebuild.
          shopt -s nullglob
          for lib in build/bin/libllama.so* build/bin/libggml*.so*; do
            case "$(basename "$lib")" in
              *.so|*.so.[0-9]|*.so.[0-9][0-9]) cp -L "$lib" dist/ ;;
            esac
          done
          shopt -u nullglob
          cp LICENSE dist/
          echo "Packed libraries:"
          ls -lh dist/*.so* || true
          # Verify SONAME names are present (not just unversioned .so)
          ls dist/*.so.0 >/dev/null 2>&1 || { echo "::error::No .so.0 files found — SONAME resolution will fail"; exit 1; }
          # Verify the full stage executor ABI is exported
          for sym in abi_version create destroy load alloc_slots \
            activation_descriptor_json capabilities_json execute_batch \
            release_slot last_error chat_begin chat_parse; do
            nm -D dist/libtensorrelay_stage_executor.so | grep -q " tr_stage_executor_${sym}$" \
              || { echo "::error::Missing ABI export tr_stage_executor_${sym}"; exit 1; }
          done
          tar -czvf tensorrelay-stage-executor-linux-vulkan-x64.tar.gz -C dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tensorrelay-stage-executor-linux-vulkan-x64
          path: tensorrelay-stage-executor-linux-vulkan-x64.tar.gz
          retention-days: 30

  windows-cuda-x64:
    name: Windows CUDA 13.1 + Vulkan x64
    runs-on: windows-2022
    env:
      VULKAN_VERSION: 1.4.313.2
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.1'

      - name: Install Vulkan SDK
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Ninja
        run: choco install ninja

      - name: Cache Windows CUDA build
        id: cache-win-build
        uses: actions/cache@v4
        with:
          path: build
          # v5: LLAMA_OPENSSL=OFF entered CMAKE_COMMON; the key hashes sources
          # only, so a flag change must bump this version or a warm cache
          # re-packs a build dir configured with the old flags.
          # v6: GGML_BACKEND_DL=ON entered CMAKE_COMMON (upstream merge 2026-08-14
          # made it mandatory for GGML_CPU_ALL_VARIANTS; backends now ship as DLLs).
          key: win-cuda13.1-vulkan-v6-${{ hashFiles('ggml/**', 'src/**', 'common/**', 'tools/**', 'CMakeLists.txt', 'ggml/CMakeLists.txt') }}

      - name: Build stage executor
        if: steps.cache-win-build.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if exist build rmdir /s /q build
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_VULKAN=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;100;120" ^
            ${{ env.CMAKE_COMMON }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release --target tensorrelay_stage_executor -j %NINJA_JOBS%

      - name: Pack artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\bin\Release\tensorrelay_stage_executor.dll dist\
          Get-ChildItem build\bin\Release\*.dll | Copy-Item -Destination dist\
          # Bundle CUDA runtime DLLs (not in build output, installed by toolkit).
          # CUDA 13 moved these out of bin\ into bin\x64\, so search the whole
          # toolkit rather than assuming bin\. ggml-cuda.dll imports cublas64_13,
          # which imports cudart64_13 + cublasLt64_13; without them LoadLibrary
          # fails with error 126, and a release ggml swallows that silently
          # (bool silent = true under NDEBUG in ggml_backend_load_all_from_path).
          # So VERIFY they landed, exactly as the VC redist below does -- a
          # missing one ships a CUDA bundle that can never load on any machine.
          foreach ($pat in @("cudart64_*.dll","cublas64_*.dll","cublasLt64_*.dll")) {
            Get-ChildItem -Path $env:CUDA_PATH -Recurse -Filter $pat -ErrorAction SilentlyContinue |
              Select-Object -First 1 | Copy-Item -Destination dist\ -ErrorAction SilentlyContinue
          }
          foreach ($req in @("cudart64_13.dll","cublas64_13.dll","cublasLt64_13.dll")) {
            if (-not (Test-Path (Join-Path dist $req))) {
              Write-Error "CUDA runtime DLL $req not bundled (searched $env:CUDA_PATH); ggml-cuda.dll would fail to load with error 126"
            }
          }
          # Bundle the MSVC CRT redistributables: consumer machines without the
          # VC redist otherwise fail LoadLibrary with error 126 on a transitive
          # dependency (the same failure class as the MinGW libgomp incident).
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($crt) {
            Copy-Item "$($crt.FullName)\vcruntime140.dll" dist\ -ErrorAction SilentlyContinue
            Copy-Item "$($crt.FullName)\vcruntime140_1.dll" dist\ -ErrorAction SilentlyContinue
            Copy-Item "$($crt.FullName)\msvcp140.dll" dist\ -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path dist\vcruntime140.dll)) { Write-Error "MSVC CRT redist DLLs not found on runner" }
          Copy-Item LICENSE dist\
          Get-ChildItem dist\ | Format-Table Name, Length -AutoSize
          if (-not (Test-Path dist\tensorrelay_stage_executor.dll)) { Write-Error "stage executor dll missing" }
          Compress-Archive -Path dist\* -DestinationPath tensorrelay-stage-executor-win-cuda-13.1-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tensorrelay-stage-executor-win-cuda-13.1-x64
          path: tensorrelay-stage-executor-win-cuda-13.1-x64.zip
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux-vulkan-x64, windows-cuda-x64]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tensorrelay-${{ github.sha }}
          name: TensorRelay Build ${{ github.sha }}
          body: |
            Stage Executor Library bundles built from the tensorrelay branch.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            artifacts/tensorrelay-stage-executor-linux-vulkan-x64/tensorrelay-stage-executor-linux-vulkan-x64.tar.gz
            artifacts/tensorrelay-stage-executor-win-cuda-13.1-x64/tensorrelay-stage-executor-win-cuda-13.1-x64.zip
